name: DinhEuro Build & Hostinger Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build DinhEuro Production Bundle
        run: npm run build

      - name: Verify Dist Artifacts
        run: |
          test -f dist/index.html || { echo "dist/index.html missing!"; exit 1; }
          test -f dist/.htaccess || { echo "dist/.htaccess missing!"; exit 1; }
          test -d dist/assets || { echo "dist/assets missing!"; exit 1; }
          echo "DinhEuro build completed and verified successfully for Hostinger deployment!"
