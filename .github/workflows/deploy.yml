name: CI/CD Pipeline - DinhEuro Build & Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify Production Bundle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Typecheck (Lint)
        run: npm run lint

      - name: 🚀 Build Production Bundle (Vite + Server)
        run: npm run build

      - name: 🛡️ Verify Production Build Artifacts
        run: |
          test -f dist/index.html || { echo "❌ dist/index.html is missing!"; exit 1; }
          test -f dist/.htaccess || { echo "❌ dist/.htaccess is missing!"; exit 1; }
          echo "✅ dist/ build is complete and valid for Hostinger deployment!"
          ls -la dist/
